# SoulGame - Game Configuration
# Base configuration, can be overridden by user://config/user.cfg

[display]
target_fps=60
vsync=true
fullscreen=false
resolution_width=1280
resolution_height=720

[audio]
master_volume=1.0
sfx_volume=0.8
music_volume=0.6

[debug]
show_fps=false
show_debug_overlay=true
log_level=DEBUG

[game]
default_tick_rate=20
max_souls_per_scene=8
auto_save_interval=300

[network]
http_timeout_ms=5000
http_max_retries=3
ws_reconnect_base_ms=1000
ws_reconnect_max_ms=30000
ws_ping_interval_ms=5000
state_sync_enabled=true

[localization]
default_language=en
fallback_language=en
auto_detect=true
log_missing_translations=true

[performance]
target_fps=60
max_particles_per_system=100
max_lights=20
object_pool_warning_threshold=0.8
performance_monitor_enabled=true

[input]
key_repeat_delay=0.5
key_repeat_interval=0.05
input_context_stack_size=10

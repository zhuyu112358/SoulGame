# SoulGame - World Configuration
# Default world engine parameters

[defaults]
tick_rate=20
time_scale=1.0
gravity=0.0
world_size_x=100
world_size_z=100

[physics]
collision_enabled=true
max_velocity=5.0
friction=0.9

[environment]
default_temperature=20.0
default_humidity=0.5
default_light=1.0
weather_enabled=true

[day_night]
cycle_enabled=true
day_length_seconds=600
night_start=18.0
day_start=6.0
dawn_duration=1.0
dusk_duration=1.0

[entities]
max_entities=1000
entity_update_batch_size=50
entity_culling_enabled=true
entity_culling_distance=50.0

[communication]
acoustic_propagation_enabled=true
sound_attenuation=0.1
max_communication_distance=30.0
message_queue_size=100

[sync]
state_sync_interval_ms=50
delta_compression_enabled=true
snapshot_interval_ms=1000
max_pending_updates=100
